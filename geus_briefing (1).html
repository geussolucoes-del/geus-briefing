<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GEUS — Formulário de Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --purple:#a855f7;--purple-dark:#7c3aed;--purple-glow:rgba(168,85,247,0.35);
  --bg:#090914;--bg2:#100d24;--card:rgba(255,255,255,0.03);
  --border:rgba(168,85,247,0.18);--border-hover:rgba(168,85,247,0.45);
  --text:#f0eeff;--muted:#7c7999;--muted2:#4a4670;
  --gold:#f59e0b;--green:#22c55e;--red:#ef4444;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
#bg-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;}
#root{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px;}
.logo-wrap{text-align:center;margin-bottom:32px;cursor:default;user-select:none;}
.logo-wrap img{width:64px;height:64px;object-fit:contain;}
.logo-name{font-family:'Syne',sans-serif;font-weight:800;font-size:11px;letter-spacing:4px;color:var(--purple);opacity:.85;margin-top:8px;text-transform:uppercase;}
.progress-wrap{width:100%;max-width:580px;margin-bottom:24px;}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;color:var(--muted);}
.progress-meta strong{color:var(--purple);font-family:'Syne',sans-serif;}
.progress-bar-bg{height:5px;background:rgba(255,255,255,0.05);border-radius:99px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--purple-dark),var(--purple));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 14px var(--purple-glow);}
.steps-dots{display:flex;gap:6px;margin-top:10px;justify-content:center;}
.step-dot{width:6px;height:6px;border-radius:99px;background:var(--muted2);transition:all .3s;}
.step-dot.active{background:var(--purple);width:20px;box-shadow:0 0 8px var(--purple-glow);}
.step-dot.done{background:var(--purple-dark);}
.card{width:100%;max-width:580px;background:rgba(255,255,255,0.025);border:1px solid var(--border);border-radius:24px;padding:36px 32px;backdrop-filter:blur(24px);box-shadow:0 32px 100px rgba(0,0,0,.5);animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.step-tag{font-size:11px;font-family:'Syne',sans-serif;letter-spacing:3px;color:var(--purple);margin-bottom:10px;text-transform:uppercase;}
.step-title{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;color:var(--text);margin-bottom:8px;line-height:1.25;}
.step-desc{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:28px;}
.field{margin-bottom:22px;}
.label{display:block;font-size:11px;font-weight:600;font-family:'Syne',sans-serif;letter-spacing:2px;color:var(--purple);margin-bottom:10px;text-transform:uppercase;}
.input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s;}
.input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,0.12);}
.input::placeholder{color:var(--muted2);}
textarea.input{min-height:88px;resize:vertical;}
.pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill{padding:9px 17px;border-radius:99px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap;}
.pill:hover{border-color:var(--purple);color:var(--purple);}
.pill.selected{border-color:var(--purple);background:rgba(168,85,247,0.15);color:var(--text);font-weight:600;box-shadow:0 0 12px rgba(168,85,247,0.2);}
.opt-card{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-radius:14px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;text-align:left;width:100%;margin-bottom:8px;transition:all .2s;}
.opt-card:hover{border-color:var(--purple);color:var(--text);}
.opt-card.selected{border-color:var(--purple);background:rgba(168,85,247,0.12);color:var(--text);box-shadow:0 0 14px rgba(168,85,247,0.18);}
.opt-icon{font-size:22px;flex-shrink:0;margin-top:1px;}
.opt-body .opt-title{font-weight:600;font-size:14px;margin-bottom:2px;}
.opt-body .opt-sub{font-size:12px;opacity:.65;line-height:1.4;}
.info-box{background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.25);border-radius:14px;padding:18px 20px;font-size:14px;line-height:1.65;color:#c4b5fd;margin-bottom:18px;}
.info-box strong{color:var(--text);}
.warn-box{background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.25);border-radius:14px;padding:18px 20px;font-size:14px;line-height:1.65;color:#fcd34d;margin-bottom:18px;}
.warn-box strong{color:#fbbf24;}
.cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
.cost-cell{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:14px;text-align:center;}
.cost-cell .cc-label{font-size:11px;font-family:'Syne',sans-serif;letter-spacing:2px;color:var(--gold);margin-bottom:4px;}
.cost-cell .cc-value{font-size:22px;font-weight:800;font-family:'Syne',sans-serif;color:#fbbf24;margin-bottom:3px;}
.cost-cell .cc-sub{font-size:11px;color:#d97706;}
.btn-primary{background:linear-gradient(135deg,var(--purple-dark),var(--purple));color:white;border:none;border-radius:99px;padding:14px 36px;font-size:15px;font-weight:600;font-family:'Syne',sans-serif;cursor:pointer;box-shadow:0 8px 32px var(--purple-glow);transition:all .25s;letter-spacing:.5px;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px var(--purple-glow);}
.btn-primary:disabled{background:rgba(255,255,255,0.08);color:var(--muted2);box-shadow:none;cursor:not-allowed;transform:none;}
.btn-secondary{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:14px 24px;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;}
.btn-secondary:hover{border-color:var(--border-hover);color:var(--text);}
.btn-full{width:100%;background:linear-gradient(135deg,var(--purple-dark),var(--purple));color:white;border:none;border-radius:14px;padding:17px;font-size:16px;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;box-shadow:0 8px 32px var(--purple-glow);transition:all .25s;}
.btn-full:hover{box-shadow:0 12px 48px var(--purple-glow);}
.nav{display:flex;gap:12px;margin-top:22px;justify-content:center;}
.review-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(168,85,247,0.1);font-size:13.5px;gap:16px;}
.review-row:last-child{border-bottom:none;}
.review-key{color:var(--muted);flex-shrink:0;width:120px;}
.review-val{color:var(--text);text-align:right;flex:1;}
.color-dots{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.color-dot{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s;}
.color-dot.sel{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple);}
.welcome-checklist{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14px;color:var(--muted);}
.welcome-checklist .ic{font-size:20px;}
.ty-emoji{font-size:72px;margin-bottom:20px;display:block;animation:bounce 1s infinite alternate;}
@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-10px);}}
.ty-contact-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);padding:6px 0;}
.admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(8px);}
.admin-card{background:#0d0d22;border:1px solid rgba(168,85,247,0.3);border-radius:20px;padding:32px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.admin-title{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--purple);}
.admin-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;}
.lead-card{background:rgba(168,85,247,0.05);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;}
.lead-name{font-weight:700;font-size:14px;color:var(--text);margin-bottom:4px;}
.lead-info{font-size:12px;color:var(--muted);margin-bottom:3px;}
.lead-date{font-size:11px;color:var(--muted2);}
.btn-export{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:#22c55e;border-radius:10px;padding:10px 18px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:600;font-size:13px;transition:all .2s;}
.btn-export:hover{background:rgba(34,197,94,0.2);}
.gas-code{background:#060612;border:1px solid rgba(168,85,247,0.2);border-radius:10px;padding:14px;font-family:monospace;font-size:11px;color:#c4b5fd;overflow-x:auto;white-space:pre;line-height:1.5;max-height:200px;overflow-y:auto;}
.section-divider{height:1px;background:rgba(168,85,247,0.1);margin:20px 0;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.g2{grid-template-columns:1fr;}.card{padding:24px 18px;}.cost-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>

function updateProgress(){if(currentStep<0){progressWrap.style.display='none';navWrap.style.display='none';return;}progressWrap.style.display='block';const pct=Math.round(((currentStep+1)/TOTAL_STEPS)*100);progressFill.style.width=pct+'%';stepLabel.textContent=(currentStep+1)+'/'+TOTAL_STEPS+' — '+STEPS_NAMES[currentStep];pctLabel.textContent=pct+'%';buildDots();if(currentStep<TOTAL_STEPS-1){navWrap.style.display='flex';btnBack.style.display=currentStep>0?'block':'none';btnNext.style.display='block';btnNext.textContent=currentStep===TOTAL_STEPS-2?'Revisar →':'Continuar →';}else{navWrap.style.display='none';}}
function canAdvance(){switch(currentStep){case 0:return formData.nomeEmpresa.trim()&&formData.nicho;case 1:return formData.cidade.trim()&&formData.pais;case 2:return formData.temSite&&formData.jaInvestiu&&formData.nivelConhecimento;case 3:return!!formData.aceitaInvestimento;case 4:return formData.nomeCompleto.trim()&&formData.email.trim()&&formData.whatsapp.trim();case 5:return true;case 6:return false;default:return true;}}
function refreshNextBtn(){const ok=canAdvance();btnNext.disabled=!ok;btnNext.style.opacity=ok?'1':'0.45';}
function goTo(step){currentStep=step;card.style.animation='none';requestAnimationFrame(()=>{card.style.animation='fadeUp .4s ease both';renderStep();updateProgress();refreshNextBtn();});window.scrollTo({top:0,behavior:'smooth'});}
btnBack.addEventListener('click',()=>{if(currentStep>0)goTo(currentStep-1);});
btnNext.addEventListener('click',()=>{if(canAdvance()&&currentStep<TOTAL_STEPS-1)goTo(currentStep+1);});
document.getElementById('logoWrap').addEventListener('click',()=>{logoClicks++;clearTimeout(logoTimer);logoTimer=setTimeout(()=>logoClicks=0,3000);if(logoClicks>=5){logoClicks=0;openAdmin();}});
function renderStep(){switch(currentStep){case -1:renderWelcome();break;case 0:renderNegocio();break;case 1:renderLocalizacao();break;case 2:renderPresenca();break;case 3:renderInvestimento();break;case 4:renderContato();break;case 5:renderProjeto();break;case 6:renderRevisao();break;}}
function renderWelcome(){card.innerHTML='<div style="text-align:center;padding:12px 0 4px"><div style="font-family:\'DM Sans\';font-weight:300;font-size:16px;color:var(--muted);margin-bottom:8px;">Olá! Seja muito bem-vindo(a) 👋</div><div style="font-family:\'Syne\';font-weight:800;font-size:28px;color:var(--text);line-height:1.2;margin-bottom:10px;">Vamos entender<br/>o seu negócio</div><div style="font-size:14px;color:var(--muted);line-height:1.75;margin-bottom:32px;max-width:400px;margin-left:auto;margin-right:auto;">Este formulário nos ajuda a criar a estratégia digital perfeita para você. São apenas <strong style="color:#c4b5fd">5 minutinhos</strong> — prometo que é simples! 😊</div><div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 24px;text-align:left;margin-bottom:28px;"><div style="font-family:\'Syne\';font-weight:700;font-size:12px;letter-spacing:2px;color:var(--purple);margin-bottom:14px;">O QUE VOCÊ VAI PREENCHER</div>'+[['📦','Sobre o seu negócio'],['🌎','Onde você está localizado(a)'],['📱','Sua presença nas redes sociais'],['💰','Como funciona o investimento em anúncios'],['📞','Seus dados de contato'],['🎨','Detalhes do projeto']].map(([ic,tx])=>'<div class="welcome-checklist"><span class="ic">'+ic+'</span><span>'+tx+'</span></div>').join('')+'</div><button class="btn-primary" onclick="goTo(0)">Começar agora →</button></div>';}
function renderNegocio(){const nichos=[{v:'limpeza',l:'🧹 Limpeza'},{v:'beleza',l:'💄 Beleza & Estética'},{v:'construcao',l:'🔨 Construção & Reformas'},{v:'saude',l:'🏥 Saúde & Bem-estar'},{v:'alimentacao',l:'🍔 Alimentação'},{v:'educacao',l:'📚 Educação & Cursos'},{v:'moda',l:'👗 Moda & Acessórios'},{v:'pets',l:'🐾 Pets'},{v:'tech',l:'💻 Tecnologia'},{v:'outro',l:'✨ Outro'}];const tempos=['Menos de 1 ano','1 a 2 anos','3 a 5 anos','Mais de 5 anos'];card.innerHTML='<div class="step-tag">Passo 1 de 7</div><div class="step-title">Sobre o seu negócio 📦</div><div class="step-desc">Vamos começar pelo básico — o que você faz e como se chama seu negócio.</div><div class="field"><label class="label">Nome da empresa ou negócio *</label><input class="input" id="f-nomeEmpresa" value="'+esc(formData.nomeEmpresa)+'" placeholder="Ex: Maria Beleza &amp; Estética" oninput="formData.nomeEmpresa=this.value;refreshNextBtn()"/></div><div class="field"><label class="label">Qual é o seu nicho? *</label><div style="font-size:13px;color:var(--muted);margin-bottom:12px;">Escolha a área que mais combina com o seu negócio:</div><div class="pills">'+nichos.map(n=>'<button class="pill'+(formData.nicho===n.v?' selected':'')+'" onclick="selectNicho(\''+n.v+'\')">'+n.l+'</button>').join('')+'</div><div id="nicho-custom" style="margin-top:12px;display:'+(formData.nicho==='outro'?'block':'none')+'"><input class="input" value="'+esc(formData.nichoCustom)+'" placeholder="Qual é o seu nicho?" oninput="formData.nichoCustom=this.value"/></div></div><div class="field"><label class="label">Há quanto tempo você tem este negócio?</label><div class="pills">'+tempos.map(t=>'<button class="pill'+(formData.tempoNegocio===t?' selected':'')+'" onclick="selectTempo(\''+t+'\')">'+t+'</button>').join('')+'</div></div>';}
function selectNicho(v){formData.nicho=v;document.getElementById('nicho-custom').style.display=v==='outro'?'block':'none';document.querySelectorAll('[onclick^="selectNicho"]').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==='selectNicho(\''+v+'\')'));refreshNextBtn();}
function selectTempo(v){formData.tempoNegocio=v;document.querySelectorAll('[onclick^="selectTempo"]').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==='selectTempo(\''+v+'\')'));}
function renderLocalizacao(){const paises=['Brasil','Estados Unidos','Portugal','Outro'];const areas=[{v:'local',ic:'📍',t:'Só na minha cidade',s:'Atendo clientes perto de onde estou'},{v:'regional',ic:'🗺️',t:'Na minha região/estado',s:'Atendo cidades próximas também'},{v:'nacional',ic:'🇧🇷',t:'Em todo o país',s:'Atendo de qualquer estado'},{v:'internacional',ic:'🌎',t:'Internacional',s:'Atendo em outros países'}];card.innerHTML='<div class="step-tag">Passo 2 de 7</div><div class="step-title">Onde você está? 🌎</div><div class="step-desc">Isso nos ajuda a direcionar seus anúncios para as pessoas certas, no lugar certo.</div><div class="field"><label class="label">País *</label><div class="pills">'+paises.map(p=>'<button class="pill'+(formData.pais===p?' selected':'')+'" onclick="selectPais(\''+p+'\')">'+p+'</button>').join('')+'</div></div><div class="g2" style="margin-bottom:22px"><div><label class="label">Cidade *</label><input class="input" value="'+esc(formData.cidade)+'" placeholder="Ex: São Paulo" oninput="formData.cidade=this.value;refreshNextBtn()"/></div><div><label class="label">Estado / Região</label><input class="input" value="'+esc(formData.estado)+'" placeholder="Ex: SP ou Massachusetts" oninput="formData.estado=this.value"/></div></div><div class="field"><label class="label">Você atende...</label>'+areas.map(a=>'<button class="opt-card'+(formData.areaAtendimento===a.v?' selected':'')+'" onclick="selectArea(\''+a.v+'\')"><span class="opt-icon">'+a.ic+'</span><div class="opt-body"><div class="opt-title">'+a.t+'</div><div class="opt-sub">'+a.s+'</div></div></button>').join('')+'</div>';}
function selectPais(v){formData.pais=v;document.querySelectorAll('[onclick^="selectPais"]').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==='selectPais(\''+v+'\')'));refreshNextBtn();}
function selectArea(v){formData.areaAtendimento=v;document.querySelectorAll('[onclick^="selectArea"]').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==='selectArea(\''+v+'\')'));}
function renderPresenca(){const redes=['Instagram','Facebook','TikTok','WhatsApp Business','YouTube','LinkedIn','Nenhuma ainda'];const niveis=[{v:'1',ic:'😅',t:'Iniciante total',s:'Não entendo quase nada de marketing digital'},{v:'2',ic:'🤔',t:'Básico',s:'Já vi algumas coisas sobre anúncios e redes sociais'},{v:'3',ic:'😎',t:'Intermediário',s:'Já usei ferramentas de marketing antes'},{v:'4',ic:'🚀',t:'Avançado',s:'Tenho experiência com campanhas e métricas'}];card.innerHTML='<div class="step-tag">Passo 3 de 7</div><div class="step-title">Você está no digital? 📱</div><div class="step-desc">Vamos entender como você está presente na internet hoje.</div><div class="field"><label class="label">Você tem site? *</label><div class="pills">'+[{v:'sim',l:'✅ Sim, tenho'},{v:'nao',l:'❌ Não tenho'},{v:'criando',l:'🔨 Estou criando'}].map(o=>'<button class="pill'+(formData.temSite===o.v?' selected':'')+'" onclick="selectSite(\''+o.v+'\')">'+o.l+'</button>').join('')+'</div><div id="url-site" style="margin-top:12px;display:'+(formData.temSite==='sim'?'block':'none')+'"><input class="input" value="'+esc(formData.urlSite)+'" placeholder="www.seunegocio.com" oninput="formData.urlSite=this.value"/></div></div><div class="field"><label class="label">Quais redes sociais você usa para o negócio?</label><div style="font-size:13px;color:var(--muted);margin-bottom:12px;">Pode marcar mais de uma opção:</div><div class="pills">'+redes.map(r=>'<button class="pill'+(formData.redesSociais.includes(r)?' selected':'')+'" onclick="toggleRede(\''+r+'\')">'+r+'</button>').join('')+'</div></div><div class="field"><label class="label">Você já investiu em anúncios online? *</label><div class="pills">'+[{v:'sim',l:'✅ Sim, já investi'},{v:'nao',l:'❌ Nunca investi'},{v:'naosei',l:'🤷 Não sei o que é isso'}].map(o=>'<button class="pill'+(formData.jaInvestiu===o.v?' selected':'')+'" onclick="selectJaInvestiu(\''+o.v+'\')">'+o.l+'</button>').join('')+'</div></div><div class="field"><label class="label">Como você se considera no digital? *</label>'+niveis.map(n=>'<button class="opt-card'+(formData.nivelConhecimento===n.v?' selected':'')+'" onclick="selectNivel(\''+n.v+'\')"><span class="opt-icon">'+n.ic+'</span><div class="opt-body"><div class="opt-title">'+n.t+'</div><div class="opt-sub">'+n.s+'</div></div></button>').join('')+'</div>';}
function selectSite(v){formData.temSite=v;document.getElementById('url-site').style.display=v==='sim'?'block':'none';document.querySelectorAll('[onclick^="selectSite"]').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==='selectSite(\''+v+'\')'));refreshNextBtn();}
function toggleRede(v){const idx=formData.redesSociais.indexOf(v);if(idx>=0)formData.redesSociais.splice(idx,1);else formData.redesSociais.push(v);document.querySelectorAll('[onclick^="toggleRede"]').forEach(b=>{const bv=b.getAttribute('onclick').match(/toggleRede\('(.+?)'\)/)[1];b.classList.toggle('selected',formData.redesSociais.includes(bv));});}
function selectJaInvestiu(v){formData.jaInvestiu=v;document.querySelectorAll('[onclick^="selectJaInvestiu"]').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==='selectJaInvestiu(\''+v+'\')'));refreshNextBtn();}
function selectNivel(v){formData.nivelConhecimento=v;document.querySelectorAll('[onclick^="selectNivel"]').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==='selectNivel(\''+v+'\')'));refreshNextBtn();}
function renderInvestimento(){card.innerHTML='<div class="step-tag">Passo 4 de 7</div><div class="step-title">Entenda o investimento 💰</div><div class="step-desc">Antes de continuar, é importante que você entenda como funciona o custo dos anúncios. Leia com atenção!</div><div class="info-box"><div style="font-family:\'Syne\';font-weight:700;font-size:14px;color:var(--text);margin-bottom:8px;">💡 O que são anúncios no Google?</div>Imagine que você tem um funcionário que fica 24 horas por dia na rua mostrando seu negócio para quem está procurando exatamente o que você oferece — só que esse funcionário é <strong>digital</strong>, e chega a centenas de pessoas ao mesmo tempo.<br/><br/>Isso são os <strong>anúncios do Google Ads</strong>. Eles aparecem só para quem está <strong>ativamente buscando</strong> pelo seu tipo de serviço.</div><div class="warn-box"><div style="font-family:\'Syne\';font-weight:700;font-size:14px;margin-bottom:10px;">⚠️ Custo com anúncios — importante!</div><p style="margin-bottom:14px;">Para os anúncios rodarem, você paga uma <strong>verba diária diretamente ao Google</strong>. Esse valor é <strong>separado</strong> do nosso serviço — não passa pela GEUS.</p><div class="cost-grid"><div class="cost-cell"><div class="cc-label">Mínimo</div><div class="cc-value">5/dia</div><div class="cc-sub">~50 por mês</div></div><div class="cost-cell"><div class="cc-label">Recomendado</div><div class="cc-value">5/dia</div><div class="cc-sub">~50 por mês</div></div></div><div style="font-size:13px;margin-top:6px;color:#d97706;">✅ Você paga isso <strong>direto ao Google</strong>, no próprio cartão. A GEUS não toca nesse dinheiro.</div></div><div class="field"><label class="label">Você entende e aceita esse investimento? *</label>'+[{v:'sim',ic:'✅',t:'Sim, entendo e estou pronto(a) para investir',s:'Estou ciente dos custos e topo investir esse valor por mês'},{v:'duvida',ic:'🤔',t:'Entendi, mas tenho dúvidas',s:'Quero conversar com a equipe antes de decidir'},{v:'nao',ic:'❌',t:'Não consigo investir esse valor agora',s:'Preciso de mais tempo ou uma alternativa'}].map(o=>'<button class="opt-card'+(formData.aceitaInvestimento===o.v?' selected':'')+'" onclick="selectAceita(\''+o.v+'\')"><span class="opt-icon">'+o.ic+'</span><div class="opt-body"><div class="opt-title">'+o.t+'</div><div class="opt-sub">'+o.s+'</div></div></button>').join('')+'<div id="aceita-msg"></div></div><div id="orcamento-field" style="display:'+(formData.aceitaInvestimento==='sim'?'block':'none')+'"><div class="field"><label class="label">Com qual verba diária você pensa em começar?</label>'+[{v:'15',l:'5/dia (~50/mês)'},{v:'20',l:'0/dia (~00/mês)'},{v:'25',l:'5/dia (~50/mês)'},{v:'mais',l:'Mais de 5/dia'}].map(o=>'<button class="opt-card'+(formData.orcamentoDiario===o.v?' selected':'')+'" onclick="selectOrcamento(\''+o.v+'\')"><span class="opt-icon">💵</span><div class="opt-body"><div class="opt-title">'+o.l+'</div></div></button>').join('')+'</div></div>';if(formData.aceitaInvestimento)showAceitaMsg(formData.aceitaInvestimento);}
function selectAceita(v){formData.aceitaInvestimento=v;document.querySelectorAll('[onclick^="selectAceita"]').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==='selectAceita(\''+v+'\')'));document.getElementById('orcamento-field').style.display=v==='sim'?'block':'none';showAceitaMsg(v);refreshNextBtn();}
function showAceitaMsg(v){const el=document.getElementById('aceita-msg');if(!el)return;if(v==='duvida')el.innerHTML='<div class="info-box" style="margin-top:12px;margin-bottom:0">Sem problema! Nossa equipe vai tirar todas as suas dúvidas após receber o formulário. 😊</div>';else if(v==='nao')el.innerHTML='<div class="info-box" style="margin-top:12px;margin-bottom:0;border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05);color:#fca5a5">Tudo bem! Envie o formulário assim mesmo e converse com nossa equipe — podemos encontrar alternativas juntos.</div>';else el.innerHTML='';}
function selectOrcamento(v){formData.orcamentoDiario=v;document.querySelectorAll('[onclick^="selectOrcamento"]').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==='selectOrcamento(\''+v+'\')'));}
function renderContato(){card.innerHTML='<div class="step-tag">Passo 5 de 7</div><div class="step-title">Seus dados de contato 📞</div><div class="step-desc">Para que nossa equipe possa entrar em contato com você!</div><div class="field"><label class="label">Nome completo *</label><input class="input" value="'+esc(formData.nomeCompleto)+'" placeholder="Ex: Maria da Silva" oninput="formData.nomeCompleto=this.value;refreshNextBtn()"/></div><div class="field"><label class="label">E-mail *</label><input type="email" class="input" value="'+esc(formData.email)+'" placeholder="seuemail@exemplo.com" oninput="formData.email=this.value;refreshNextBtn()"/></div><div class="field"><label class="label">WhatsApp *</label><input class="input" value="'+esc(formData.whatsapp)+'" placeholder="+55 (11) 99999-9999 ou +1 (781) 905-7237" oninput="formData.whatsapp=this.value;refreshNextBtn()"/><div style="font-size:12px;color:var(--muted2);margin-top:6px;">Inclua o código do país: +55 para Brasil, +1 para EUA</div></div><div class="field"><label class="label">CPF ou SSN (documento)</label><input class="input" value="'+esc(formData.documento)+'" placeholder="000.000.000-00 ou 000-00-0000" oninput="formData.documento=this.value"/><div style="font-size:12px;color:var(--muted2);margin-top:6px;">🔒 Necessário para o contrato. Seus dados são confidenciais.</div></div><div class="field"><label class="label">Endereço completo</label><input class="input" value="'+esc(formData.endereco)+'" placeholder="Rua, número, cidade, estado, CEP/ZIP Code" oninput="formData.endereco=this.value"/></div>';}
function renderProjeto(){const coresPalette=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f43f5e','#a855f7','#000000','#ffffff'];card.innerHTML='<div class="step-tag">Passo 6 de 7</div><div class="step-title">Sobre o projeto 🎨</div><div class="step-desc">Agora vamos falar sobre a identidade visual e os objetivos do seu projeto. (Tudo opcional!)</div><div class="field"><label class="label">Você tem logotipo?</label><div class="pills">'+[{v:'sim',l:'✅ Tenho logo'},{v:'nao',l:'❌ Não tenho'},{v:'criando',l:'🔨 Estou criando'}].map(o=>'<button class="pill'+(formData.temLogo===o.v?' selected':'')+'" onclick="selectLogo(\''+o.v+'\')">'+o.l+'</button>').join('')+'</div>'+(formData.temLogo==='sim'?'<div class="info-box" style="margin-top:12px;margin-bottom:0">📎 Você pode enviar sua logo para nós pelo WhatsApp após o formulário!</div>':'')+'</div><div class="field"><label class="label">Cores que você gosta para o negócio</label><div style="font-size:13px;color:var(--muted);margin-bottom:12px;">Clique para selecionar as cores que mais combinam com sua marca:</div><div class="color-dots">'+coresPalette.map(c=>'<div class="color-dot'+(formData.coresPref.includes(c)?' sel':'')+'" style="background:'+c+';'+(c==='#ffffff'?'border:2px solid rgba(255,255,255,0.2)':'')+'" onclick="toggleCor(\''+c+'\')"></div>').join('')+'</div><input class="input" value="'+esc(formData.coresTexto)+'" placeholder="Ou descreva: ex: azul marinho, dourado, tons terrosos..." oninput="formData.coresTexto=this.value"/></div><div class="field"><label class="label">Sites que você admira (referências)</label><textarea class="input" placeholder="Cole links de sites que você gosta, ou descreva o estilo que você quer para o seu...">'+esc(formData.sitesRef)+'</textarea></div><div class="field"><label class="label">Qual é o seu principal objetivo?</label>'+[{v:'clientes',ic:'🎯',t:'Conseguir mais clientes'},{v:'marca',ic:'🌟',t:'Aumentar o reconhecimento da marca'},{v:'vendas',ic:'💰',t:'Aumentar as vendas'},{v:'todos',ic:'✨',t:'Tudo isso!'}].map(o=>'<button class="opt-card'+(formData.objetivos===o.v?' selected':'')+'" onclick="selectObjetivo(\''+o.v+'\')"><span class="opt-icon">'+o.ic+'</span><div class="opt-body"><div class="opt-title">'+o.t+'</div></div></button>').join('')+'</div><div class="field"><label class="label">Algo mais que queira nos contar?</label><textarea class="input" placeholder="Fique à vontade: dúvidas, expectativas, o que te preocupa, o que você espera dos resultados...">'+esc(formData.observacoes)+'</textarea></div>';const tas=card.querySelectorAll('textarea');tas[0].addEventListener('input',e=>formData.sitesRef=e.target.value);tas[1].addEventListener('input',e=>formData.observacoes=e.target.value);}
function selectLogo(v){formData.temLogo=v;renderProjeto();}
function toggleCor(v){const idx=formData.coresPref.indexOf(v);if(idx>=0)formData.coresPref.splice(idx,1);else formData.coresPref.push(v);document.querySelectorAll('.color-dot').forEach(d=>{const dc=d.getAttribute('onclick').match(/toggleCor\('(.+?)'\)/)[1];d.classList.toggle('sel',formData.coresPref.includes(dc));});}
function selectObjetivo(v){formData.objetivos=v;document.querySelectorAll('[onclick^="selectObjetivo"]').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==='selectObjetivo(\''+v+'\')'));}
function renderRevisao(){const nichoMap={limpeza:'Limpeza',beleza:'Beleza & Estética',construcao:'Construção & Reformas',saude:'Saúde & Bem-estar',alimentacao:'Alimentação',educacao:'Educação & Cursos',moda:'Moda',pets:'Pets',tech:'Tecnologia',outro:formData.nichoCustom||'Outro'};const sitMap={sim:'Sim',nao:'Não',criando:'Criando'};const invMap={sim:'Sim, pronto(a)',duvida:'Tem dúvidas',nao:'Não no momento'};const rows=[['Empresa',formData.nomeEmpresa],['Nicho',nichoMap[formData.nicho]||formData.nicho],['Tempo de negócio',formData.tempoNegocio],['Localização',[formData.cidade,formData.estado,formData.pais].filter(Boolean).join(', ')],['Área de atendimento',formData.areaAtendimento],['Tem site',sitMap[formData.temSite]||formData.temSite],['Redes sociais',formData.redesSociais.length?formData.redesSociais.join(', '):'—'],['Já investiu em anúncios',formData.jaInvestiu==='sim'?'Sim':formData.jaInvestiu==='nao'?'Não':'Não conhecia'],['Aceita investimento',invMap[formData.aceitaInvestimento]||formData.aceitaInvestimento],['Orçamento diário',formData.orcamentoDiario?'$'+formData.orcamentoDiario+'/dia':'—'],['Nome',formData.nomeCompleto],['E-mail',formData.email],['WhatsApp',formData.whatsapp],['Objetivo',formData.objetivos]].filter(([,v])=>v&&v!=='—');card.innerHTML='<div class="step-tag">Passo 7 de 7</div><div class="step-title">Confira suas respostas ✅</div><div class="step-desc">Tudo certo? Revise abaixo e clique em enviar!</div><div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px;">'+rows.map(([k,v])=>'<div class="review-row"><span class="review-key">'+esc(k)+'</span><span class="review-val">'+esc(String(v))+'</span></div>').join('')+'</div><div class="info-box">🔒 Suas informações são <strong>confidenciais</strong> e serão usadas apenas para personalizar nossa estratégia para o seu negócio.</div><button class="btn-full" id="btnSubmit" onclick="submitForm()">🚀 Enviar formulário</button>';}
function renderThankYou(){card.innerHTML='<div style="text-align:center;padding:16px 0"><span class="ty-emoji">🎉</span><div style="font-family:\'Syne\';font-weight:800;font-size:26px;color:var(--text);margin-bottom:12px;">Formulário enviado!</div><div style="font-size:15px;color:var(--muted);line-height:1.75;margin-bottom:28px;">Nossa equipe vai analisar suas respostas e entrar em contato em breve.<br/>Fique de olho no WhatsApp e e-mail! 📱</div><div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:left;margin-bottom:20px;"><div style="font-family:\'Syne\';font-weight:700;font-size:12px;letter-spacing:2px;color:var(--purple);margin-bottom:14px;">PRÓXIMOS PASSOS</div>'+[['1️⃣','Nossa equipe analisa seu perfil'],['2️⃣','Você recebe uma proposta personalizada'],['3️⃣','Começamos a trabalhar juntos! 🚀']].map(([ic,tx])=>'<div style="display:flex;gap:12px;align-items:center;padding:8px 0;font-size:14px;color:var(--muted);"><span style="font-size:20px;">'+ic+'</span><span>'+tx+'</span></div>').join('')+'</div><div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;text-align:left;"><div style="font-family:\'Syne\';font-weight:700;font-size:12px;letter-spacing:2px;color:var(--purple);margin-bottom:10px;">FALE COM A GEUS</div><div class="ty-contact-row">✉️ <span>geussolucoes@gmail.com</span></div><div class="ty-contact-row">📱 <span>+55 (33) 9800-2785</span></div></div></div>';progressWrap.style.display='none';navWrap.style.display='none';}
async function submitForm(){const btn=document.getElementById('btnSubmit');if(btn){btn.disabled=true;btn.textContent='⏳ Enviando...';}const submission={...formData,timestamp:new Date().toISOString(),id:Date.now().toString()};try{let list=[];try{const existing=await window.storage.get('geus_leads',true);if(existing)list=JSON.parse(existing.value);}catch{}list.push(submission);await window.storage.set('geus_leads',JSON.stringify(list),true);}catch(e){console.error('Storage:',e);}if(webhookUrl){try{await fetch(webhookUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(submission)});}catch(e){console.error('Webhook:',e);}}renderThankYou();}
function openAdmin(){document.getElementById('adminOverlay').style.display='flex';renderAdminLogin();}
document.getElementById('adminClose').addEventListener('click',()=>{document.getElementById('adminOverlay').style.display='none';adminAuth=false;});
function renderAdminLogin(){document.getElementById('adminBody').innerHTML='<div class="field"><label class="label">Senha de acesso</label><input type="password" class="input" id="adminPassInput" placeholder="Digite a senha..." onkeydown="if(event.key===\'Enter\')tryAdminLogin()"/></div><button class="btn-primary" onclick="tryAdminLogin()">Entrar →</button><div id="adminError" style="color:#f87171;font-size:13px;margin-top:10px;display:none">Senha incorreta.</div>';setTimeout(()=>{const el=document.getElementById('adminPassInput');if(el)el.focus();},100);}
function tryAdminLogin(){const val=document.getElementById('adminPassInput').value;if(val===ADMIN_PASS){adminAuth=true;loadAndRenderAdmin();}else{document.getElementById('adminError').style.display='block';}}
async function loadAndRenderAdmin(){try{const res=await window.storage.get('geus_leads',true);submissions=res?JSON.parse(res.value):[];}catch{submissions=[];}renderAdminDash();}
function renderAdminDash(){const gasCode='function doPost(e) {\n  const sheet = SpreadsheetApp\n    .getActiveSpreadsheet()\n    .getActiveSheet();\n  const data = JSON.parse(e.postData.contents);\n  if (sheet.getLastRow() === 0) {\n    sheet.appendRow(["Data","Empresa","Nicho",\n      "Cidade","País","Tem Site","Já Investiu",\n      "Aceita Investimento","Nome","Email",\n      "WhatsApp","Objetivo"]);\n  }\n  sheet.appendRow([\n    new Date(data.timestamp).toLocaleString("pt-BR"),\n    data.nomeEmpresa, data.nicho,\n    data.cidade, data.pais, data.temSite,\n    data.jaInvestiu, data.aceitaInvestimento,\n    data.nomeCompleto, data.email,\n    data.whatsapp, data.objetivos\n  ]);\n  return ContentService\n    .createTextOutput(JSON.stringify({ok:true}))\n    .setMimeType(ContentService.MimeType.JSON);\n}';document.getElementById('adminBody').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;"><div style="font-size:14px;color:var(--text);">📋 <strong>'+submissions.length+'</strong> lead(s) recebido(s)</div><div style="display:flex;gap:8px;flex-wrap:wrap;">'+(submissions.length?'<button class="btn-export" onclick="exportCSV()">⬇️ Exportar CSV</button>':'')+'<button class="btn-export" style="background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#f87171;" onclick="clearLeads()">🗑️ Limpar</button></div></div><div style="margin-bottom:18px;"><label class="label">URL do Webhook (Google Apps Script)</label><input class="input" value="'+esc(webhookUrl)+'" placeholder="https://script.google.com/macros/s/.../exec" oninput="webhookUrl=this.value"/><div style="font-size:12px;color:var(--muted2);margin-top:6px;">Configure para salvar leads automaticamente no Google Sheets.</div></div><div class="section-divider"></div><details style="margin-bottom:18px;"><summary style="cursor:pointer;font-family:\'Syne\';font-size:12px;letter-spacing:2px;color:var(--purple);text-transform:uppercase;">⚙️ Script Google Apps Script</summary><div style="margin-top:12px;"><div style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px;">1. Crie uma planilha em sheets.google.com<br/>2. Clique em <strong style="color:var(--text)">Extensões → Apps Script</strong><br/>3. Cole o código abaixo e salve<br/>4. Clique em <strong style="color:var(--text)">Implantar → Nova implantação → App da Web → Qualquer pessoa → Implantar</strong><br/>5. Cole a URL acima ↑</div><div class="gas-code">'+esc(gasCode)+'</div><button onclick="navigator.clipboard.writeText(\''+esc(gasCode).replace(/'/g,"\'")+'\').then(()=>alert(\'Copiado!\'))" style="margin-top:8px;background:rgba(168,85,247,0.1);border:1px solid var(--border);color:var(--purple);border-radius:8px;padding:8px 14px;cursor:pointer;font-family:\'DM Sans\';font-size:12px;">📋 Copiar código</button></div></details><div class="section-divider"></div>'+(submissions.length===0?'<div style="text-align:center;padding:32px;color:var(--muted2);font-size:14px;">Nenhum lead ainda.<br/>Compartilhe o formulário! 🚀</div>':submissions.slice().reverse().map((s,i)=>'<div class="lead-card"><div class="lead-name">'+esc(s.nomeCompleto||s.nomeEmpresa||'Lead '+(submissions.length-i))+'</div><div class="lead-info">🏢 '+esc(s.nomeEmpresa)+' &nbsp;·&nbsp; 🏷️ '+esc(s.nicho)+'</div><div class="lead-info">✉️ '+esc(s.email)+' &nbsp;·&nbsp; 📱 '+esc(s.whatsapp)+'</div><div class="lead-info">📍 '+esc([s.cidade,s.estado,s.pais].filter(Boolean).join(', '))+' &nbsp;·&nbsp; 💰 '+esc(s.aceitaInvestimento||'—')+'</div><div class="lead-date">'+new Date(s.timestamp).toLocaleString('pt-BR')+'</div></div>').join(''));}
function exportCSV(){if(!submissions.length)return;const e2=v=>'"'+String(Array.isArray(v)?v.join('; '):v||'').replace(/"/g,'""')+'"';const headers=Object.keys(submissions[0]).join(',');const rows=submissions.map(s=>Object.values(s).map(e2).join(','));const blob=new Blob([[headers,...rows].join('\n')],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=Object.assign(document.createElement('a'),{href:url,download:'geus_leads_'+Date.now()+'.csv'});a.click();URL.revokeObjectURL(url);}
async function clearLeads(){if(!confirm('Limpar todos os leads? Esta ação não pode ser desfeita.'))return;try{await window.storage.delete('geus_leads',true);}catch{}submissions=[];renderAdminDash();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
goTo(-1);
</script>
